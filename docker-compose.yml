services:
  postgres:
    image: postgres:17-alpine
    container_name: exchangetracing-postgres
    environment:
      POSTGRES_DB: exchangetracing
      POSTGRES_USER: exchangetracing
      POSTGRES_PASSWORD: exchangetracing
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchangetracing -d exchangetracing"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
